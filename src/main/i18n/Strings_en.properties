guide.calendar.title=How to restore a missed day
guide.calendar.description=The restore calendar, for when the 24 hours are over.
guide.calendar.1.title=The streak ended a while ago
guide.calendar.1.text=You chatted for 7 days, then missed one, and the streak ended. A new one started after that — the flame shows 3.\nRestore no longer works, but the missed day can be marked in the calendar.
guide.calendar.2.title=Open the calendar
guide.calendar.2.text=In Plugins, choose Streak restore menu.\nDays of the current streak are green.
guide.calendar.3.title=Pick the missed day
guide.calendar.3.text=Tap the day when you did not chat.\nCheck the date before confirming.
guide.calendar.4.title=The day is marked
guide.calendar.4.text=The restored day is blue, the day before it is yellow.\nUp to two days can be restored this way in one chat.
guide.calendar.5.title=Recount the streak
guide.calendar.5.text=The plugin offers to recount the streak — accept.\nThe days before and after the gap join into one streak.
guide.calendar.6.title=The streak is whole again
guide.calendar.6.text=The calendar shows the whole streak: 11 days including the restored one.
guide.calendar.7.title=The flame is updated
guide.calendar.7.text=The flame in the chat and in the list shows the full streak length again.
guide.timezone.title=How to set the time zone
guide.timezone.description=Why you and your contact see different numbers and how to fix it.
guide.timezone.1.title=You see 2, your contact sees 5
guide.timezone.1.text=Each of you counts the streak on your own device, by the chat time zone.\nBy your time two conversations fell on the same day and the next day stayed empty. For your contact the second one was already past midnight, so they have 5 days in a row.
guide.timezone.2.title=Open Timezone
guide.timezone.2.text=Tap Timezone. It decides when a new day starts in this chat.\nBy default it is the device time zone.
guide.timezone.3.title=Find your contact''s time zone
guide.timezone.3.text=Scroll to your contact''s time zone.\nOn the right is the time on your clock when it is midnight there.
guide.timezone.4.title=Select it
guide.timezone.4.text=Tap the row — a check mark appears at the top.
guide.timezone.5.title=Save
guide.timezone.5.text=Tap the check mark and confirm the change.
guide.timezone.6.title=The streak is recounted
guide.timezone.6.text=The streak is counted by your contact''s days — now you have 5 too.
guide.timezone.7.title=One time zone for both
guide.timezone.7.text=For the numbers to match, you both need the same time zone in this chat.\nThe easiest way is to offer sync: it sends your contact both the streak and the time zone.
guide.sync.title=How to sync a streak
guide.sync.description=What to do when you and your contact see different numbers.
guide.sync.1.title=The numbers differ
guide.sync.1.text=Your flame shows 12, your contact''s shows less — say, they reinstalled the plugin.\nSync sends them your streak data and the chat time zone.
guide.sync.2.title=Mark that your contact has the plugin
guide.sync.2.text=Turn on Peer has the plugin installed. Sync cannot be offered without it.
guide.sync.3.title=Offer sync
guide.sync.3.text=Tap Offer sync and confirm.
guide.sync.4.title=The offer is sent
guide.sync.4.text=The panel closes and your offer appears in the chat.\nYour contact sees it with an Apply button.
guide.sync.5.title=Your contact applied it
guide.sync.5.text=Once your contact taps Apply, a confirmation appears in the chat.\nYou now have the same streak and the same time zone.
guide.sync.6.title=If you got an offer
guide.sync.6.text=Tap Apply in your contact''s message — your streak data is replaced with theirs.

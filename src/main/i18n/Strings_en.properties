# Interactive basics tutorials
guide.create.title=How to start a streak
guide.create.description=Three days of chatting in a row, and a flame appears next to the name.
guide.create.1.title=A private chat
guide.create.1.text=Streaks are counted only in private chats with people.\nWith automatic creation on, there is nothing to tap — just keep chatting.
guide.create.2.title=Day 1
guide.create.2.text=You wrote and your contact replied the same day, so the first day counts.\nNo flame yet.
guide.create.3.title=Day 2
guide.create.3.text=The next day you chat again.\nTwo days in a row, still no flame.
guide.create.4.title=Day 3: a flame appears
guide.create.4.text=After the third day in a row the streak starts: a flame with 3 appears next to the name.
guide.create.5.title=The flame in the chat list
guide.create.5.text=The flame is shown in the chat list too. Its number is how many days in a row you have been chatting.\nIf automatic creation is off or you want to count older messages, use rebuild.
guide.maintain.title=How to keep a streak
guide.maintain.description=What it takes every day to keep the streak growing.
guide.maintain.1.title=A new day
guide.maintain.1.text=The flame has cooled down: you have not chatted today yet.\nThe streak is not lost — it is a reminder to write.
guide.maintain.2.title=Waiting for a reply
guide.maintain.2.text=You wrote, but the day counts only once your contact replies.
guide.maintain.3.title=The day counts
guide.maintain.3.text=Your contact replied: the flame is lit again and the streak grew from 3 to 4.\nMore messages today do not change the number.
guide.maintain.4.title=Again tomorrow
guide.maintain.4.text=Chat every day.\nThe chat time zone in the control panel decides when a new day starts. By default it is the device time zone.
guide.rebuild.title=How to rebuild a streak
guide.rebuild.description=Recount the streak from the chat history.
guide.rebuild.1.title=The number does not match the history
guide.rebuild.1.text=The chat has 10 days of chatting in a row, but the flame shows 3.\nRebuild recounts the days from the chat history.
guide.menu.title=Open the chat menu
guide.menu.text=Tap the three dots in the top right corner of the chat.
guide.control.title=Open the control panel
guide.control.text=Choose Control panel. It has the streak settings and actions for this chat.
guide.rebuild.4.title=Tap Rebuild
guide.rebuild.4.text=Tap Rebuild streak and pet.\nIf the chat has no pet, only the streak is recounted.
guide.rebuild.5.title=Confirm
guide.rebuild.5.text=Confirm the rebuild and wait for it to finish. Keep Telegram open while it runs.
guide.rebuild.6.title=Done: 10 days
guide.rebuild.6.text=The streak is recounted from the history: 10 days in a row.\nRebuild is only needed when the number is off or you want to count older messages.
guide.restore.title=How to restore a streak
guide.restore.description=Missed a day? You have 24 hours to bring the streak back.
guide.restore.1.title=A missed day
guide.restore.1.text=The streak lasted 7 days, then a day passed without chatting.
guide.restore.2.title=The streak ended
guide.restore.2.text=The chat shows a “Streak ended!” message with a Restore button.\nYou have 24 hours to restore it.
guide.restore.3.title=Tap Restore
guide.restore.3.text=Tap the button in that message.
guide.restore.4.title=The streak is restored
guide.restore.4.text=The flame is back with its previous number, 7, and the chat shows “You restored the streak!”.
guide.restore.5.title=Keep chatting
guide.restore.5.text=The button works for 24 hours after the break. If you miss it, mark the missed day in the restore calendar.

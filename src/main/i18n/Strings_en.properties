guide.plugins.title=Open Plugins
guide.plugins.text=The Plugins submenu holds the items of all installed plugins.
guide.scroll.title=Scroll down
guide.scroll.text=Rebuild is at the very bottom of the panel, in the Danger zone section.
guide.rebuild_final.title=The flame is updated
guide.rebuild_final.text=Close the window: the flame in the chat and in the list now shows 10.
guide.profile.title=The flame in the profile
guide.profile.description=The streak information window.
guide.profile.chat.title=Open the chat
guide.profile.chat.text=The streak in this chat is already 30 days long.\nEverything about it is in your contact''s profile.
guide.profile.open.title=Open the profile
guide.profile.open.text=Tap your contact''s name at the top of the chat.
guide.profile.badge.title=Tap the flame
guide.profile.badge.text=The streak window opens: its length and tips about chatting, levels and restoring.
guide.profile.done.title=Done
guide.profile.done.text=Close the window to return to the chat.\nTap the flame to open it again.
